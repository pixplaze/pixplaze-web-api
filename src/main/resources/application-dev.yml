server:
  address: 0.0.0.0
  port: 8080
spring:
  flyway:
    # тестовые серверы и ваучеры — только для разработки
    locations: classpath:db/migration,classpath:db/dev
app:
  url.api.gateway: http://192.168.1.100:8080
  url.app.gateway: http://192.168.1.100:5173
  security:
    auth:
      device:
        expiration: 5m
        polling-interval: 5s
      token:
        access.expiration-minutes: 20160
        refresh.expiration.days: 30
