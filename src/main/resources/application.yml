server:
  address: 0.0.0.0
  port: 8080
spring:
  datasource:
    url: ${PIXPLAZE_DB_URL}
    username: ${PIXPLAZE_DB_USERNAME}
    password: ${PIXPLAZE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    out-of-order: true
    # Repeatable-миграции, применённые в БД, но отсутствующие локально (dev-seed'ы из db/dev при запуске
    # без профиля dev), не считаются ошибкой; пропажа версионных миграций — по-прежнему ошибка.
    ignore-migration-patterns: "repeatable:missing"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  application:
    name: "pixplaze-web-api"
app:
  url.api.gateway: ${PIXPLAZE_WEB_API_URL}
  url.app.gateway: ${PIXPLAZE_WEB_APP_URL}
  security:
    auth:
      device:
        expiration: 5m
        polling-interval: 5s
        decision-ttl: 15s
        verification-uri: ${app.url.app.gateway}/auth
      token:
        access:
          expiration-minutes: 2400
          kid: k1
          private-key: ${EC_PRIVATE_KEY}
          public-key: ${EC_PUBLIC_KEY}
        refresh:
          expiration.days: 30
    cors:
      allowed-origins:
        - "*"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
